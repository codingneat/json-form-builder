<mat-grid-list cols="1" color="primary">
  <section class="banner-jwt">
    <div class="banner-jwt__container">
      <app-logo size="large"></app-logo>
      <ng-container *transloco="let t">
        <p>
          {{ t('banner.header') }}
        </p>
        <p>{{ t('banner.sub_header') }}</p>

        <a
          mat-raised-button
          class="banner-jwt__button"
          target="_blank"
          href="https://daniel-vergara-echeverri.netlify.app/"
          >{{ t('banner.button') }}</a
        >
      </ng-container>
    </div>
  </section>
</mat-grid-list>
