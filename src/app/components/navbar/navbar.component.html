<mat-toolbar color="primary" class="navbar">
  <app-logo *ngIf="showLogo$ | async" @logoTrigger></app-logo>
  <ng-container *transloco="let t">
    <span class="navbar__app-name" [@titleTrigger]="(showLogo$ | async) ? 'right' : 'left'">{{
      t('title')
    }}</span>
  </ng-container>

  <button
    class="navbar__theme-switcher"
    type="button"
    aria-label="Toggle theme"
    mat-icon-button
    (click)="onToggleTheme()"
    matTooltip="Toggle theme">
    <mat-icon color="primary">
      {{ theme() === 'light' ? 'light_mode' : 'dark_mode' }}
    </mat-icon>
  </button>
</mat-toolbar>
